<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: linear-gradient(135deg, #0a3fb8 0%, #1668e3 45%, #17b6cf 100%);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 86px;
    position: relative;
  }
  /* Dezente Wellenform als Hintergrundmotiv */
  .waves {
    position: absolute; right: 70px; top: 50%; transform: translateY(-50%);
    display: flex; align-items: center; gap: 11px; opacity: .13;
  }
  .waves i {
    display: block; width: 13px; border-radius: 99px; background: #fff;
  }
  .row { display: flex; align-items: center; gap: 40px; position: relative; }
  .icon {
    width: 188px; height: 188px; border-radius: 42px;
    box-shadow: 0 18px 50px rgba(0, 20, 60, .38);
    flex-shrink: 0;
  }
  h1 {
    font-size: 96px; font-weight: 700; letter-spacing: -.028em; line-height: 1;
    margin-bottom: 20px;
  }
  .tagline { font-size: 32px; font-weight: 500; line-height: 1.35; opacity: .96; max-width: 900px; }
  .chips { display: flex; gap: 12px; margin-top: 44px; position: relative; }
  .chip {
    font-size: 23px; font-weight: 600; padding: 12px 24px; border-radius: 99px;
    background: rgba(255, 255, 255, .19); border: 1px solid rgba(255, 255, 255, .28);
  }
  .foot {
    position: absolute; left: 86px; bottom: 46px;
    font-size: 24px; font-weight: 500; opacity: .78; letter-spacing: .01em;
  }
</style>
</head>
<body>
  <div class="waves">
    <i style="height:52px"></i><i style="height:104px"></i><i style="height:186px"></i>
    <i style="height:260px"></i><i style="height:150px"></i><i style="height:220px"></i>
    <i style="height:88px"></i><i style="height:140px"></i><i style="height:44px"></i>
  </div>

  <div class="row">
    <img class="icon" src="icon.png" alt="">
    <div>
      <h1>Sprachacus</h1>
      <p class="tagline">
        Diktieren, Texte verfassen und Meetings mitschreiben —<br>
        auf dem Mac, ohne Abo, ohne Cloud.
      </p>
    </div>
  </div>

  <div class="chips">
    <span class="chip">Diktat</span>
    <span class="chip">Schreibassistent</span>
    <span class="chip">Meeting-Transkription</span>
    <span class="chip">Open Source</span>
  </div>

  <div class="foot">github.com/harsting/sprachacus</div>
</body>
</html>
